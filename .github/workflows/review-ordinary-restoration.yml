name: ZImage non-production restoration rehearsal

on:
  push:
    branches: [codex/zimage-attestation-shadow-20261122]
    paths:
      - '.github/workflows/review-ordinary-restoration.yml'
      - 'ops/aliyun/paired/**'
      - 'ops/aliyun/backend/verify.py'
      - 'ops/aliyun/backend/test_verify.py'
      - 'ops/aliyun/backend/ordinary_readonly_transport.py'
      - 'ops/aliyun/backend/test_ordinary_readonly_transport.py'
      - 'ops/aliyun/frontend/**'
      - 'ops/aliyun/github_pair_*.py'
      - 'ops/aliyun/test_github_pair_*.py'
      - 'ops/aliyun/github_protected_merge_*.py'
      - 'ops/aliyun/test_github_protected_merge_*.py'
      - 'ops/aliyun/release-three-layer.py'

permissions:
  contents: read

jobs:
  restore-journal:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/codex/zimage-attestation-shadow-20261122'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify private staging, the shared POSIX lock and paired restoration journal
        working-directory: ops/aliyun/paired
        run: python3 -B -m unittest -v test_ordinary test_ordinary_journal test_ordinary_stage test_ordinary_system test_ordinary_restore test_ordinary_receiver test_ordinary_github test_ordinary_authority test_ordinary_install_inventory
      - name: Verify bounded SSH frames and receipt acceptance
        working-directory: ops/aliyun
        run: python3 -B -m unittest -v test_github_pair_handoff test_github_pair_public test_github_pair_ssh test_github_protected_merge_observe test_github_protected_merge_shadow
      - name: Exercise the independent backend verifier and receipt protocol
        working-directory: ops/aliyun/backend
        run: python3 -B -m unittest -v test_verify test_receipt test_ordinary_readonly_transport
      - name: Exercise private frontend sealing on the Linux filesystem
        working-directory: ops/aliyun/frontend
        run: python3 -B -m unittest -v test_frontend_release.ReleaseTests.test_private_archive_seals_without_using_upload_directory test_frontend_release.ReleaseTests.test_private_archive_digest_mismatch_creates_no_sealed_release
