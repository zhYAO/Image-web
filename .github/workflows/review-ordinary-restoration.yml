name: ZImage non-production restoration rehearsal

on:
  push:
    branches: [codex/zimage-attestation-shadow-20261122]
    paths:
      - '.github/workflows/review-ordinary-restoration.yml'
      - 'ops/aliyun/paired/**'

permissions:
  contents: read

jobs:
  restore-journal:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/codex/zimage-attestation-shadow-20261122'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the shared POSIX lock and paired restoration journal
        working-directory: ops/aliyun/paired
        run: python3 -B -m unittest -v test_ordinary test_ordinary_journal test_ordinary_system test_ordinary_restore
