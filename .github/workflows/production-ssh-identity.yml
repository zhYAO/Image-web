name: Verify production SSH identity
on:
  workflow_dispatch:
permissions: {}

jobs:
  authenticate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 2
    steps:
      - name: Authenticate without opening a session
        env:
          ECS_ADDRESS: ${{ vars.ZIMAGE_ECS_ADDRESS }}
          HOST_KEY: ${{ vars.ZIMAGE_ECS_HOST_KEY }}
          RELEASE_KEY: ${{ secrets.ZIMAGE_PRODUCTION_RELEASE_KEY }}
          # Independently verified release account Ed25519 public-key fingerprint.
          EXPECTED_KEY_SHA256: 'SHA256:2KEGjp7U/rFuYaMGzq9WKQKv61ZDvbVKJSc1kqG+AyE'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          set +x
          set -euo pipefail
          export -n RELEASE_KEY
          export LC_ALL=C
          umask 077
          die() { printf '%s\n' "$1" >&2; exit 1; }
          [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REPOSITORY == zhYAO/Image-web &&
             $GITHUB_REF == refs/heads/main && $GITHUB_REF_PROTECTED == true ]] || die 'Refused event or ref'
          printf '%s\n' 'receiver=not-tested'
          [[ -n ${RELEASE_KEY:-} ]] || die 'release-secret=missing'
          [[ $EXPECTED_KEY_SHA256 =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || die 'client fingerprint needs review'
          address=$(/usr/bin/python3 -IB -c 'import ipaddress,sys; print(ipaddress.ip_address(sys.argv[1]))' "$ECS_ADDRESS")
          [[ $address != *%* ]] || die 'unscoped ECS address required'
          target=zimage-release@$address

          tmp=$(mktemp -d /tmp/zimage-proof.XXXXXXXX)
          agent_pid=''
          master_closed=false
          control=(/usr/bin/ssh -F /dev/null -S "$tmp/master" -O)
          cleanup() {
            rc=$?
            trap - EXIT HUP INT TERM
            unset RELEASE_KEY
            if [[ $master_closed == false && -S $tmp/master ]]; then
              timeout -k 1 3 "${control[@]}" exit -- "$target" </dev/null >/dev/null 2>&1 || rc=1
            fi
            if [[ -n $agent_pid ]]; then
              kill "$agent_pid" 2>/dev/null || :
              wait "$agent_pid" 2>/dev/null || :
            fi
            rm -rf -- "$tmp" || rc=1
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Normalize one pre-verified public key. A known_hosts record must select this endpoint.
          # Never discover or replace trust material on the network.
          /usr/bin/python3 -IB - "$address" "$tmp/hosts" <<'PIN'
          import base64
          import os
          from pathlib import Path
          import subprocess
          import sys

          address, output = sys.argv[1:]
          line = os.environ['HOST_KEY'].strip()
          if len(line.splitlines()) != 1:
              sys.exit('expected one SSH host pin')
          fields = line.split()
          if fields[:1] != ['ssh-ed25519']:
              if len(fields) < 3 or fields[0].startswith('@') or any(ch in fields[0] for ch in '*?!'):
                  sys.exit('invalid known_hosts pin')
              names = ('zimage-production', address, 'www.zimage.store', f'[{address}]:22', '[www.zimage.store]:22')
              if not any(subprocess.run(['/usr/bin/ssh-keygen','-F',name,'-f','/dev/stdin'], input=line+'\n',
                                        text=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
                         for name in names):
                  sys.exit('host pin names a different endpoint')
              fields = fields[1:]
          if len(fields) < 2 or fields[0] != 'ssh-ed25519':
              sys.exit('expected an Ed25519 host pin')
          blob = base64.b64decode(fields[1], validate=True)
          if len(blob) != 51 or blob[:19] != b'\0\0\0\x0bssh-ed25519\0\0\0\x20':
              sys.exit('invalid Ed25519 host key')
          Path(output).write_text('zimage-production ssh-ed25519 '+fields[1]+'\n')
          PIN

          unset SSH_AGENT_PID SSH_ASKPASS DISPLAY
          export SSH_AUTH_SOCK="$tmp/agent.sock" SSH_ASKPASS_REQUIRE=never
          /usr/bin/ssh-agent -D -a "$SSH_AUTH_SOCK" -t 60 </dev/null >/dev/null 2>&1 &
          agent_pid=$!
          # ssh-add -l returns 1 for a reachable empty agent and 2 for an unavailable agent.
          ready=false
          for ((i=0; i<50; i++)); do
            status=0
            /usr/bin/ssh-add -l </dev/null >/dev/null 2>&1 || status=$?
            if [[ $status == 1 ]]; then ready=true; break; fi
            [[ $status == 2 ]] && kill -0 "$agent_pid" 2>/dev/null || die 'unexpected local agent state'
            sleep .05
          done
          [[ $ready == true ]] || die 'local agent unavailable'
          if ! builtin printf '%s\n' "$RELEASE_KEY" | /usr/bin/ssh-add -t 60 - >/dev/null 2>&1; then
            die 'release identity could not be loaded'
          fi
          unset RELEASE_KEY
          /usr/bin/ssh-add -L | awk 'NR==1 && $1=="ssh-ed25519" {print $1, $2; ok=1} END {exit !(NR==1 && ok)}' > "$tmp/identity.pub"
          read -r bits actual_fp rest < <(/usr/bin/ssh-keygen -E sha256 -lf "$tmp/identity.pub")
          [[ $bits == 256 && $actual_fp == "$EXPECTED_KEY_SHA256" ]] || die 'client-fingerprint=mismatch'
          printf '%s\n' 'client-fingerprint=verified'


          rc=0
          timeout -k 2 15 /usr/bin/ssh -F /dev/null -fNTnM -S "$tmp/master" -vv -E "$tmp/ssh.log" \
            -o BatchMode=yes -o ConnectTimeout=8 -o ConnectionAttempts=1 -o ControlPersist=15s \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=zimage-production -o HostKeyAlgorithms=ssh-ed25519 \
            -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$tmp/hosts" -o UpdateHostKeys=no \
            -o IdentitiesOnly=yes -o "IdentityAgent=$SSH_AUTH_SOCK" -i "$tmp/identity.pub" \
            -o CertificateFile=none -o PubkeyAcceptedAlgorithms=ssh-ed25519 -o PreferredAuthentications=publickey \
            -o ClearAllForwardings=yes -o ForwardAgent=no -o ForwardX11=no -- "$target" \
            </dev/null >/dev/null 2>&1 || rc=$?
          grep -Fxq 'debug1: SSH2_MSG_SERVICE_ACCEPT received' "$tmp/ssh.log" || die 'pinned-host=unverified'
          printf '%s\n' 'pinned-host=verified'
          grep -Fq "debug1: Server accepts key: $tmp/identity.pub ED25519 $actual_fp " "$tmp/ssh.log" || die 'release-public-key=unconfirmed'
          printf '%s\n' 'release-public-key=accepted'
          [[ $rc == 0 ]] && grep -Eq '^Authenticated to .+ using "publickey"\.$' "$tmp/ssh.log" || die 'signed-publickey-auth=unconfirmed'
          timeout -k 1 3 "${control[@]}" check -- "$target" </dev/null >/dev/null 2>&1 || die 'master-check=failed'
          timeout -k 1 3 "${control[@]}" exit -- "$target" </dev/null >/dev/null 2>&1 || die 'master-exit=failed'
          master_closed=true
          printf '%s\n' 'signed-publickey-auth=verified'
