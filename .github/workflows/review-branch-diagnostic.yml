name: ZImage disposable review-branch release rehearsal

on:
  push:
    branches: [codex/zimage-github-actions-review-20261120]

permissions:
  contents: read

jobs:
  disposable-release-rehearsal:
    if: github.repository == 'zhYAO/Image-web' && github.event_name == 'push' && github.ref == 'refs/heads/codex/zimage-github-actions-review-20261120'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Prepare disposable VM
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /opt/zimage && test ! -L /opt/zimage
          sudo install -d -m 0755 /opt/zimage
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /opt/zimage/layer-cache
          export COREPACK_HOME="$RUNNER_TEMP/zimage-corepack"
          test "$(corepack pnpm@11.19.0 --version)" = 11.19.0
          corepack enable pnpm
      - name: Run full or admission-only checks on the isolated runner
        env:
          ZIMAGE_REVIEW_ADMISSION_ONLY: ${{ contains(github.event.head_commit.message, '[admission-only]') && '1' || '0' }}
        run: |
          set -euo pipefail
          private=$(mktemp -d "$RUNNER_TEMP/zimage-branch-fixture.XXXXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          mkdir -m 700 -- "$private/home"
          env -i PATH="$PATH" HOME="$private/home" TMPDIR="$private" \
            COREPACK_HOME="$RUNNER_TEMP/zimage-corepack" LANG=C.UTF-8 NEXT_TELEMETRY_DISABLED=1 \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            ZIMAGE_REVIEW_ADMISSION_ONLY="$ZIMAGE_REVIEW_ADMISSION_ONLY" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" bash ops/aliyun/github-review-branch-diagnostic.sh
          if [[ "$ZIMAGE_REVIEW_ADMISSION_ONLY" == 1 ]]; then
            printf '%s\n' 'Admission-only: real socket and Nginx checks passed; dual-release and Auth were not rerun. No remote deployment.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Full disposable dual release, rollback, authentication, and private admission checks passed. No remote deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
