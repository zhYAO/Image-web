name: ZImage TLS handshake comparison
on:
  push:
    branches: [codex/zimage-no-deploy-preflight-20261124]
permissions: {}
jobs:
  tls:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/codex/zimage-no-deploy-preflight-20261124' && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Compare TLS negotiation without deployment
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import subprocess
          url = 'https://www.zimage.store/api/health/ready'
          base = ['/usr/bin/curl', '-q', '--silent', '--show-error', '--ipv4', '--noproxy', '*', '--proto', '=https', '--max-time', '8', '--max-filesize', '8192', '--header', 'Cache-Control: no-cache', '--output', '/dev/null', '--write-out', '%{http_code} %{time_connect} %{time_appconnect} %{remote_ip}']
          def test(label, extra):
              p = subprocess.run(base + extra + [url], capture_output=True, text=True, timeout=10)
              parts = p.stdout.split()
              if len(parts) not in (3, 4):
                  print(f'{label} rc={p.returncode} metadata=unavailable')
                  return '', False
              status, tcp, tls = parts[:3]
              peer = parts[3] if len(parts) == 4 else ''
              error = p.stderr.lower()
              detail = next((tag for marker, tag in [('connection reset','reset'), ('unexpected eof','eof'), ('ssl_error_syscall','openssl-syscall'), ('protocol version','protocol-version'), ('handshake failure','handshake-alert'), ('certificate','certificate')] if marker in error), 'other' if error else 'none')
              print(f'{label} rc={p.returncode} http={status} tcp={float(tcp)>0} tls={float(tls)>0} detail={detail}')
              return peer, p.returncode == 0 and status == '200'
          first, a = test('default', [])
          second, b = test('tls12', ['--tlsv1.2', '--tls-max', '1.2'])
          print('same-peer=' + ('yes' if first and first == second else 'no' if first and second else 'unknown'))
          raise SystemExit(0 if a and b else 1)
          PY
