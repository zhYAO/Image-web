name: ZImage public release contract preflight
on:
  push:
    branches: [codex/zimage-no-deploy-preflight-20261124]
permissions: {}
jobs:
  public-contract:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/codex/zimage-no-deploy-preflight-20261124' && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Public contract check (no deployment)
        shell: bash
        run: |
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d"' EXIT
          curl -q --silent --fail --noproxy '*' --proto '=https' --max-time 10 --max-filesize 8192 --output "$d/check.py" https://raw.githubusercontent.com/zhYAO/Image-web/079180fea6fdd4dc3c0de87b87bd2d8cfd2fab0f/ops/aliyun/production/check.py || { echo source-fetch-failed; exit 1; }
          test "$(git hash-object --no-filters -- "$d/check.py")" = b1b343e414a617d6328291189803a318e5638522 || { echo source-digest-mismatch; exit 1; }
          python3 -I -B - "$d/check.py" 2>/dev/null <<'PY'
          import runpy, subprocess, sys
          try:
              runpy.run_path(sys.argv[1])['probe']('7a811b326aa4b344cee08bc5a33c04e44a780fd4', 'release-7a811b326aa4', local=False)
          except subprocess.CalledProcessError as exc:
              url = exc.cmd[-1]
              path = url.removeprefix('https://www.zimage.store')
              label = path if path in ('/api/health/ready', '/version.json', '/api/meta', '/api/public-config', '/') else 'versioned-js-or-unknown'
              sys.exit(print(f'public-curl-failed path={label} code={exc.returncode}') or 1)
          except Exception:
              sys.exit(print('public-contract-failed') or 1)
          print('public-contract-passed')
          PY
