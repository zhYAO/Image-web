name: ZImage anonymous SSH host identity preflight
on:
  push:
    branches: [codex/zimage-no-deploy-preflight-20261124]
permissions: {}
jobs:
  probe:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/codex/zimage-no-deploy-preflight-20261124' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify pinned SSH host identity without authentication
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import re
          import socket
          import subprocess
          import sys

          HOST = 'www.zimage.store'
          IP = '47.100.222.24'
          EXPECTED = 'SHA256:JeRc+Z2z5z7KM2QBBrwnymDM234qFUISlwsoPK3ClFk'

          try:
              addresses = {row[4][0] for row in socket.getaddrinfo(HOST, 22, socket.AF_INET, socket.SOCK_STREAM)}
          except OSError:
              sys.exit('dns-failed')
          if addresses != {IP}:
              sys.exit('dns-mismatch')

          try:
              scan = subprocess.run(['/usr/bin/ssh-keyscan', '-T', '6', '-t', 'ed25519', '-p', '22', IP],
                                    stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                    timeout=9, check=False)
              if scan.returncode or not scan.stdout:
                  sys.exit('host-key-unavailable')
              if len(scan.stdout) > 1024 or not re.fullmatch(
                      rb'47\.100\.222\.24[ \t]+ssh-ed25519[ \t]+[A-Za-z0-9+/=]{68}\r?\n', scan.stdout):
                  sys.exit('host-key-unexpected-format')
              key = subprocess.run(['/usr/bin/ssh-keygen', '-l', '-E', 'sha256', '-f', '-'],
                                   input=scan.stdout, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                   timeout=3, check=False)
              lines = key.stdout.splitlines()
              fields = lines[0].split() if len(lines) == 1 else []
              if key.returncode or len(fields) != 4 or fields[0] != b'256' or fields[-1] != b'(ED25519)':
                  sys.exit('fingerprint-unavailable')
              if fields[1] != EXPECTED.encode('ascii'):
                  sys.exit('fingerprint-mismatch')
          except (OSError, subprocess.TimeoutExpired):
              sys.exit('host-key-probe-failed')
          print('pinned-host-key-match')
          PY
