name: ZImage sender patch validation (read only)
on:
  push:
    branches: [codex/zimage-no-deploy-preflight-20261124]
permissions:
  contents: read
jobs:
  sender-check:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/codex/zimage-no-deploy-preflight-20261124' && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 079180fea6fdd4dc3c0de87b87bd2d8cfd2fab0f
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Check exact patch, kit identity, and sender regression
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 079180fea6fdd4dc3c0de87b87bd2d8cfd2fab0f
          test "$(node --version)" = v24.19.0
          patch="$(mktemp)"
          printf '%s' '' | base64 -d > "$patch"
          printf '%s  %s\n' a81c0634e62a7c39e744d3ed9b5bdbe1f57d779bd3ff946842483170c4bd4867 "$patch" | sha256sum -c -
          git apply --check --whitespace=error-all "$patch"
          git apply --whitespace=error-all "$patch"
          cd ops/aliyun/production
          python3 -B -c 'import kit; got=kit.identity(kit.source_contents()); assert got=="feb228cd9adc85825716dc9d8b532b7dfc877859cbebb7cb95a84d1911e7abbf", got; print("sender-validation kit=unchanged")'
          python3 -B -m unittest -v test_production
      - name: Exercise actual sender probe against incumbent (HTTPS GETs only)
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          import sys
          production = Path("ops/aliyun/production").resolve(strict=True)
          sys.path.insert(0, str(production))
          import send
          if Path(send.__file__).resolve() != production / "send.py" or send.probe.__module__ != "send":
              raise SystemExit("Patched sender probe was not loaded")
          send.probe("7a811b326aa4b344cee08bc5a33c04e44a780fd4","release-7a811b326aa4")
          print("sender-validation full-public-contract=pass")
          PY
