name: ZImage recovery Linux proof
on:
  push:
    branches: [codex/zimage-recovery-linux-proof-20261122]
permissions:
  contents: read
jobs:
  isolated-recovery:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/codex/zimage-recovery-linux-proof-20261122'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixture dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nginx
      - name: Verify irreversible-boundary recovery behind real loopback Nginx
        run: python3 -I -B ops/aliyun/review-ordinary-reconcile.py
      - name: Verify Linux glibc layer application
        run: python3 -B ops/aliyun/paired/test_stage.py -v
