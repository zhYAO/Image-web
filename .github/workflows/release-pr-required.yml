name: ZImage protected merge checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release-pr-required:
    name: zimage-release-pr-required
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release guard contracts without production access
        working-directory: ops/aliyun
        run: |
          python3 -B - <<'PY'
          import unittest
          names = [
              'test_github_protected_merge_shadow',
              'test_github_protected_merge_observe',
              'test_github_hosted_stage_shadow',
              'test_github_shadow_head',
              'test_github_shadow_stage_build',
              'test_github_shadow_signer_intake',
              'test_github_shadow_signer_transport',
              'test_github_shadow_wire',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < len(names):
              raise SystemExit(1)
          PY
