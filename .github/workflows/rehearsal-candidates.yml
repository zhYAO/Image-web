name: ZImage isolated release candidates

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Build only this private rehearsal candidate (never deploy)'
        type: choice
        required: true
        options: [backend, frontend]
      backend_release:
        description: 'Frontend only: exact backend SHA to evaluate in staging'
        type: string
        required: false

permissions:
  contents: read

jobs:
  backend:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.component == 'backend'
    runs-on: ubuntu-22.04
    environment: release-rehearsal
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Build and verify the backend rehearsal transport
        env:
          TARGET_JSON: ${{ vars.ZIMAGE_RELEASE_TARGET_JSON }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: bash ops/aliyun/github-rehearsal.sh backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal-backend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zimage-rehearsal/transport.tgz
            ${{ runner.temp }}/zimage-rehearsal/rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 2

  frontend:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.component == 'frontend'
    runs-on: ubuntu-22.04
    environment: release-rehearsal
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Build isolated frontend and compute exact acceptance subject
        env:
          MATCH_BACKEND_SHA: ${{ inputs.backend_release }}
          REHEARSAL_PUBLIC_CONFIG: ${{ vars.ZIMAGE_REHEARSAL_PUBLIC_CONFIG_JSON }}
        run: bash ops/aliyun/github-rehearsal.sh frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal-frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zimage-rehearsal/frontend-rehearsal.tgz
            ${{ runner.temp }}/zimage-rehearsal/frontend-subject.json
            ${{ runner.temp }}/zimage-rehearsal/rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 2
