name: ZImage protected main release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Build only this private rehearsal candidate (never deploy)'
        type: choice
        required: true
        options: [backend, frontend]
      backend_release:
        description: 'Frontend only: exact backend SHA to evaluate in staging'
        type: string
        required: false

permissions:
  contents: read

jobs:
  backend:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || inputs.component == 'backend')
    runs-on: ubuntu-22.04
    environment: release-rehearsal
    timeout-minutes: 18
    outputs:
      archive_sha: ${{ steps.build.outputs.archive_sha }}
      receipt_sha: ${{ steps.build.outputs.receipt_sha }}
      evidence_sha: ${{ steps.build.outputs.evidence_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Build and verify the backend rehearsal transport
        id: build
        env:
          ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW: ${{ vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW }}
          ZIMAGE_PAIRED_PRODUCTION: ${{ vars.ZIMAGE_PAIRED_PRODUCTION }}
          ZIMAGE_PAIRED_BUILD_MODE: ${{ vars.ZIMAGE_PAIRED_AUTOMATION }}
          TARGET_JSON: ${{ vars.ZIMAGE_RELEASE_TARGET_JSON }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: bash ops/aliyun/github-rehearsal.sh backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: ${{ vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW == 'true' && 'shadow-rehearsal' || 'rehearsal' }}-backend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zimage-rehearsal/transport.tgz
            ${{ runner.temp }}/zimage-rehearsal/rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 2

  frontend:
    if: github.repository == 'zhYAO/Image-web' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || inputs.component == 'frontend')
    runs-on: ubuntu-22.04
    environment: release-rehearsal
    timeout-minutes: 18
    outputs:
      archive_sha: ${{ steps.build.outputs.archive_sha }}
      receipt_sha: ${{ steps.build.outputs.receipt_sha }}
      evidence_sha: ${{ steps.build.outputs.evidence_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Build isolated frontend and compute exact acceptance subject
        id: build
        env:
          ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW: ${{ vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW }}
          ZIMAGE_PAIRED_PRODUCTION: ${{ vars.ZIMAGE_PAIRED_PRODUCTION }}
          MATCH_BACKEND_SHA: ${{ inputs.backend_release }}
          REHEARSAL_PUBLIC_CONFIG: ${{ vars.ZIMAGE_REHEARSAL_PUBLIC_CONFIG_JSON }}
          ZIMAGE_PAIRED_BUILD_MODE: ${{ vars.ZIMAGE_PAIRED_AUTOMATION }}
        run: bash ops/aliyun/github-rehearsal.sh frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: ${{ vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW == 'true' && 'shadow-rehearsal' || 'rehearsal' }}-frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zimage-rehearsal/frontend-rehearsal.tgz
            ${{ runner.temp }}/zimage-rehearsal/frontend-subject.json
            ${{ runner.temp }}/zimage-rehearsal/rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 2


  same-run-review:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [backend, frontend]
    environment: release-rehearsal
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Review immutable candidates from this run; never deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_ID: ${{ needs.backend.outputs.artifact_id }}
          BACKEND_ARTIFACT_DIGEST: ${{ needs.backend.outputs.artifact_digest }}
          BACKEND_ARCHIVE_SHA: ${{ needs.backend.outputs.archive_sha }}
          BACKEND_RECEIPT_SHA: ${{ needs.backend.outputs.receipt_sha }}
          BACKEND_MANIFEST_SHA: ${{ needs.backend.outputs.evidence_sha }}
          FRONTEND_ID: ${{ needs.frontend.outputs.artifact_id }}
          FRONTEND_ARTIFACT_DIGEST: ${{ needs.frontend.outputs.artifact_digest }}
          FRONTEND_ARCHIVE_SHA: ${{ needs.frontend.outputs.archive_sha }}
          FRONTEND_RECEIPT_SHA: ${{ needs.frontend.outputs.receipt_sha }}
          FRONTEND_SUBJECT_SHA: ${{ needs.frontend.outputs.evidence_sha }}
          REHEARSAL_PUBLIC_CONFIG: ${{ vars.ZIMAGE_REHEARSAL_PUBLIC_CONFIG_JSON }}
          ZIMAGE_PAIRED_BUILD_MODE: ${{ vars.ZIMAGE_PAIRED_AUTOMATION }}
          ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW: ${{ vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW }}
          ZIMAGE_PAIRED_PRODUCTION: ${{ vars.ZIMAGE_PAIRED_PRODUCTION }}
        run: bash ops/aliyun/github-rehearsal-review.sh

  isolated-runtime-rehearsal:
    if: github.repository == 'zhYAO/Image-web' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW != 'true' && vars.ZIMAGE_PAIRED_AUTOMATION != 'true' && vars.ZIMAGE_PAIRED_PRODUCTION != 'true'
    needs: [backend, frontend, same-run-review]
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Prepare disposable VM cache and pin tooling
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /opt/zimage
          sudo install -d -m 0755 /opt/zimage
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /opt/zimage/layer-cache
          export COREPACK_HOME="$RUNNER_TEMP/zimage-corepack"
          test "$(corepack pnpm@11.19.0 --version)" = 11.19.0
          corepack enable pnpm
      - name: Verify and stage exact same-run bytes without executing them
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_ID: ${{ needs.backend.outputs.artifact_id }}
          BACKEND_ARTIFACT_DIGEST: ${{ needs.backend.outputs.artifact_digest }}
          BACKEND_ARCHIVE_SHA: ${{ needs.backend.outputs.archive_sha }}
          BACKEND_RECEIPT_SHA: ${{ needs.backend.outputs.receipt_sha }}
          BACKEND_MANIFEST_SHA: ${{ needs.backend.outputs.evidence_sha }}
          FRONTEND_ID: ${{ needs.frontend.outputs.artifact_id }}
          FRONTEND_ARTIFACT_DIGEST: ${{ needs.frontend.outputs.artifact_digest }}
          FRONTEND_ARCHIVE_SHA: ${{ needs.frontend.outputs.archive_sha }}
          FRONTEND_RECEIPT_SHA: ${{ needs.frontend.outputs.receipt_sha }}
          FRONTEND_SUBJECT_SHA: ${{ needs.frontend.outputs.evidence_sha }}
          REHEARSAL_PUBLIC_CONFIG: ${{ vars.ZIMAGE_REHEARSAL_PUBLIC_CONFIG_JSON }}
          ZIMAGE_PAIRED_BUILD_MODE: ${{ vars.ZIMAGE_PAIRED_AUTOMATION }}
          ZIMAGE_PAIRED_PRODUCTION: ${{ vars.ZIMAGE_PAIRED_PRODUCTION }}
        run: bash ops/aliyun/github-rehearsal-review.sh hosted-smoke
      - name: Test exact release in a disposable local fixture (never promote)
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/zimage-hosted-smoke"
          test -d "$private" && test ! -L "$private"
          trap 'rm -rf -- "$private"' EXIT
          mkdir -m 700 -- "$private/home"
          env -i PATH="$PATH" HOME="$private/home" TMPDIR="$private" \
            COREPACK_HOME="$RUNNER_TEMP/zimage-corepack" LANG=C.UTF-8 NEXT_TELEMETRY_DISABLED=1 \
            bash ops/aliyun/github-hosted-smoke.sh "$private" "$(pwd -P)"
          printf '%s\n' 'Disposable hosted runtime fixture passed. No approval or promotable evidence was produced.' >> "$GITHUB_STEP_SUMMARY"

  hosted-shadow:
    if: github.repository == 'zhYAO/Image-web' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW == 'true' && vars.ZIMAGE_PAIRED_AUTOMATION == 'false' && vars.ZIMAGE_PAIRED_PRODUCTION == 'false'
    needs: [backend, frontend, same-run-review]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      report_id: ${{ steps.report.outputs.artifact-id }}
      descriptor_id: ${{ steps.descriptor.outputs.artifact-id }}
    steps:
      # Pin trusted intake and runtime independently of any candidate commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bc6a29043434ba62f032be8a312976fd5b9aaa9e
          path: trusted-intake
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 119d835f091fe31d0383062f37bebd070c5297ad
          path: trusted-runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bdb09caeb0fc4fb44b77d1dee6d78e3d7231d089
          path: trusted-report
          persist-credentials: false
      - name: Read exact application Git objects; never checkout or execute
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C trusted-intake rev-parse HEAD)" = bc6a29043434ba62f032be8a312976fd5b9aaa9e
          test "$(git -C trusted-runtime rev-parse HEAD)" = 119d835f091fe31d0383062f37bebd070c5297ad
          test "$(git -C trusted-report rev-parse HEAD)" = bdb09caeb0fc4fb44b77d1dee6d78e3d7231d089
          test ! -e "$RUNNER_TEMP/zimage-candidate.git"
          git init --bare "$RUNNER_TEMP/zimage-candidate.git"
          git --git-dir="$RUNNER_TEMP/zimage-candidate.git" -c core.hooksPath=/dev/null fetch --no-tags --depth=1 https://github.com/zhYAO/Image-web.git "$GITHUB_SHA"
          test "$(git --git-dir="$RUNNER_TEMP/zimage-candidate.git" rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Prepare disposable VM cache and pin tooling
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /opt/zimage
          sudo install -d -m 0755 /opt/zimage
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /opt/zimage/layer-cache
          export COREPACK_HOME="$RUNNER_TEMP/zimage-corepack"
          test "$(corepack pnpm@11.19.0 --version)" = 11.19.0
          corepack enable pnpm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
      - name: Verify and stage exact same-run bytes without executing them
        id: freeze_pair
        env:
          ZIMAGE_PAIRED_AUTOMATION: ${{ vars.ZIMAGE_PAIRED_AUTOMATION }}
          BACKEND_DIGEST: ${{ needs.backend.outputs.artifact_digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.artifact_digest }}
          ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW: ${{ vars.ZIMAGE_PROTECTED_MAIN_BROWSER_SHADOW }}
          GH_TOKEN: ${{ github.token }}
          BACKEND_ID: ${{ needs.backend.outputs.artifact_id }}
          BACKEND_ARTIFACT_DIGEST: ${{ needs.backend.outputs.artifact_digest }}
          BACKEND_ARCHIVE_SHA: ${{ needs.backend.outputs.archive_sha }}
          BACKEND_RECEIPT_SHA: ${{ needs.backend.outputs.receipt_sha }}
          BACKEND_MANIFEST_SHA: ${{ needs.backend.outputs.evidence_sha }}
          FRONTEND_ID: ${{ needs.frontend.outputs.artifact_id }}
          FRONTEND_ARTIFACT_DIGEST: ${{ needs.frontend.outputs.artifact_digest }}
          FRONTEND_ARCHIVE_SHA: ${{ needs.frontend.outputs.archive_sha }}
          FRONTEND_RECEIPT_SHA: ${{ needs.frontend.outputs.receipt_sha }}
          FRONTEND_SUBJECT_SHA: ${{ needs.frontend.outputs.evidence_sha }}
          REHEARSAL_PUBLIC_CONFIG: ${{ vars.ZIMAGE_REHEARSAL_PUBLIC_CONFIG_JSON }}
          ZIMAGE_PAIRED_BUILD_MODE: ${{ vars.ZIMAGE_PAIRED_AUTOMATION }}
          ZIMAGE_PAIRED_PRODUCTION: ${{ vars.ZIMAGE_PAIRED_PRODUCTION }}
        working-directory: trusted-intake
        run: |
          export ZIMAGE_INTAKE_TOOLS_SHA=bc6a29043434ba62f032be8a312976fd5b9aaa9e
          export ZIMAGE_CANDIDATE_BARE_GIT="$RUNNER_TEMP/zimage-candidate.git"
          bash ops/aliyun/github-rehearsal-review.sh hosted-shadow
          marker=$(/usr/bin/python3 -E -s -B "$GITHUB_WORKSPACE/trusted-report/ops/aliyun/github_shadow_measure_run.py" freeze)
          [[ "$marker" =~ ^[a-f0-9]{64}$ ]]
          printf 'admitted_marker_sha256=%s\n' "$marker" >> "$GITHUB_OUTPUT"
      - name: Measure and clean up the exact pair before handing off the report
        env:
          BACKEND_DIGEST: ${{ needs.backend.outputs.artifact_digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.artifact_digest }}
          ADMITTED_MARKER_SHA256: ${{ steps.freeze_pair.outputs.admitted_marker_sha256 }}
          ZIMAGE_PAIRED_AUTOMATION: ${{ vars.ZIMAGE_PAIRED_AUTOMATION }}
          ZIMAGE_PAIRED_PRODUCTION: ${{ vars.ZIMAGE_PAIRED_PRODUCTION }}
        run: |
          set -euo pipefail
          umask 077
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            /usr/bin/python3 -E -s -B trusted-report/ops/aliyun/github_shadow_measure_run.py measure
          test -s "$RUNNER_TEMP/zimage-report-handoff/stage-report.json"
          printf '%s\n' 'Protected shadow verified and cleaned up. Report remains unsigned and no release is authorized.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: report
        with:
          name: shadow-stage-report-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zimage-report-handoff/stage-report.json
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: descriptor
        if: vars.ZIMAGE_PAIRED_SSH_RELEASE == 'true'
        with:
          name: shadow-pair-descriptor-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zimage-hosted-shadow/pins.json
            ${{ runner.temp }}/zimage-hosted-shadow/config.json
          if-no-files-found: error
          retention-days: 2

  attest-stage:
    if: github.repository == 'zhYAO/Image-web' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [backend, frontend, hosted-shadow]
    uses: zhYAO/Image-web/.github/workflows/attest-stage.yml@f45bb63634706d74f0b1fccc3b44f1abb7bef857
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      backend-id: ${{ needs.backend.outputs.artifact_id }}
      frontend-id: ${{ needs.frontend.outputs.artifact_id }}
      report-id: ${{ needs.hosted-shadow.outputs.report_id }}

  publish-pair:
    if: github.repository == 'zhYAO/Image-web' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.ZIMAGE_PAIRED_SSH_RELEASE == 'true'
    needs: [backend, frontend, hosted-shadow, attest-stage]
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      deployments: read
      attestations: read
    concurrency:
      group: zimage-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f60b5916dbc0ef1c01c0bbddb4990b13d4cf1e00
          persist-credentials: false
      - name: Recheck the production approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/zhYAO/Image-web/environments/production |
            jq -e '.can_admins_bypass == false and ([.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length > 0))] | length == 1)' >/dev/null
      - name: Freeze the signed same-run publication handoff
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_ID: ${{ needs.backend.outputs.artifact_id }}
          FRONTEND_ID: ${{ needs.frontend.outputs.artifact_id }}
          STAGE_ID: ${{ needs.attest-stage.outputs.artifact-id }}
          DESCRIPTOR_ID: ${{ needs.hosted-shadow.outputs.descriptor_id }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -E -s -B ops/aliyun/github_pair_client.py "$RUNNER_TEMP/zimage-pair"
          gh attestation verify "$RUNNER_TEMP/zimage-pair/stage.json" --repo zhYAO/Image-web \
            --bundle "$RUNNER_TEMP/zimage-pair/stage.bundle.jsonl" \
            --signer-workflow zhYAO/Image-web/.github/workflows/attest-stage.yml \
            --signer-digest f45bb63634706d74f0b1fccc3b44f1abb7bef857 \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 >/dev/null
      - name: Verify the exact public pair selected for rollback
        env:
          EXPECTED_ROLLBACK: ${{ vars.ZIMAGE_PAIR_ROLLBACK_SHA }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXPECTED_ROLLBACK" /usr/bin/python3 -E -s -B ops/aliyun/github_pair_public.py > "$RUNNER_TEMP/zimage-rollback-public.json"
      - name: Publish through the fixed ECS command and validate its receipt
        id: publish
        env:
          ZIMAGE_PAIR_SSH_HOST: ${{ vars.ZIMAGE_PAIR_SSH_HOST }}
          ZIMAGE_PAIR_SSH_KNOWN_HOSTS: ${{ vars.ZIMAGE_PAIR_SSH_KNOWN_HOSTS }}
          ZIMAGE_PAIR_SSH_KEY: ${{ secrets.ZIMAGE_PAIR_SSH_KEY }}
          ZIMAGE_PAIR_ROLLBACK_SHA: ${{ vars.ZIMAGE_PAIR_ROLLBACK_SHA }}
        run: /usr/bin/python3 -E -s -B ops/aliyun/github_pair_ssh.py "$RUNNER_TEMP/zimage-pair" "$RUNNER_TEMP/zimage-pair-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pair-deployment-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zimage-pair-receipt.json
            ${{ runner.temp }}/zimage-rollback-public.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify the new pair through public HTTPS
        run: /usr/bin/python3 -E -s -B ops/aliyun/github_pair_public.py > "$RUNNER_TEMP/zimage-public.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pair-public-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zimage-public.json
          if-no-files-found: error
          retention-days: 30
