name: Publish merged ZImage pair
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zimage-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zhYAO/Image-web' && github.ref_protected && !github.event.deleted
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - name: Require this commit to be the merge of a PR into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -se --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" 'any(.[][]; .merged_at and .merge_commit_sha == $sha and .base.ref == "main" and .base.repo.full_name == $repo)'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - run: python3 -B -m unittest discover -s ops/aliyun/production -v
      - run: bash ops/aliyun/production/build.sh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        id: provenance
        with:
          subject-path: ${{ runner.temp }}/zimage-pair/pair.tar
      - name: Verify main tip and deliver the exact signed pair
        env:
          GH_TOKEN: ${{ github.token }}
          ECS_ADDRESS: ${{ vars.ZIMAGE_ECS_ADDRESS }}
          SSH_HOST_KEY: ${{ vars.ZIMAGE_ECS_HOST_KEY }}
          SSH_KEY: ${{ secrets.ZIMAGE_PRODUCTION_RELEASE_KEY }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          unset GH_TOKEN
          python3 -B ops/aliyun/production/send.py
