name: Isolated Linux bridge proof (no application or release)
on:
  push:
    branches: [codex/zimage-protected-stage-netproof-20261122]
permissions:
  contents: read
jobs:
  network-boundary:
    if: github.repository == 'zhYAO/Image-web' && github.event_name == 'push' && github.ref == 'refs/heads/codex/zimage-protected-stage-netproof-20261122'
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exercise fixed trusted TCP and filesystem probes
        run: bash ops/aliyun/github-protected-stage-netproof.sh
