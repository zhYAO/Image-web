    <rect x="590" y="180" width="220" height="135" rx="8" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="700" y="208" class="name" text-anchor="middle">UnifiedWorkspace</text>
    <text x="700" y="232" class="label" text-anchor="middle">SessionSidebar · Timeline</text>
    <text x="700" y="250" class="label" text-anchor="middle">UnifiedComposer · Popovers</text>
    <text x="700" y="271" class="small" text-anchor="middle">chat / image 共用工作区</text>
    <text x="700" y="289" class="small" text-anchor="middle">参考图由容器单点持有</text>
    <text x="700" y="305" class="tiny" text-anchor="middle">features/workspace/*</text>
  </g>

