  <!-- Title and footer -->
  <text x="40" y="38" class="title">ZImage · 当前架构与开发进度</text>
  <text x="40" y="60" class="subtitle">branch setup2 · HEAD 48e7382 · repository label zimage · evidence captured 2026-08-24</text>
  <text x="40" y="1000" class="tiny">Evidence: direct_syntax（imports / paths / guards）+ declared（v1.3 docs）+ stale validated artifacts（08-21）。静态相关性与变更邻近性不证明运行时因果。</text>
  <text x="40" y="1018" class="tiny">No target code execution · no source upload · no direct network request · no optional loopback LLM enrichment.</text>
</svg>
