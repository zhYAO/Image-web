    <rect x="880" y="190" width="230" height="125" rx="8" fill="#0f172a"/>
    <rect x="880" y="190" width="230" height="125" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="995" y="218" class="name" text-anchor="middle">WorkspaceGateway</text>
