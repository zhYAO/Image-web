    <rect x="850" y="505" width="280" height="50" rx="8" fill="rgba(136,19,55,.3)" stroke="#fb7185" stroke-width="1.3"/>
    <text x="990" y="527" class="name" text-anchor="middle">历史验证产物已过期</text>
