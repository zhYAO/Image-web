  <!-- Ontology limitation banner -->
  <rect x="40" y="78" width="1420" height="52" rx="8" fill="rgba(136,19,55,.32)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="62" y="100" class="name">Code Ontology Companion 0.5.2：no_supported_sources</text>
  <text x="62" y="118" class="small">仅支持 Java / Python；当前 TypeScript / Next.js 仓库未生成 JSON、RDF/Turtle 或 graph.html，本图是显式降级的仓库静态证据图。</text>

  <!-- Progress cards -->
  <g>
    <rect x="70" y="670" width="610" height="250" rx="12" fill="#0f172a"/>
    <rect x="70" y="670" width="610" height="250" rx="12" fill="rgba(8,51,68,.35)" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="96" y="702" class="name">Phase 1A · 统一首页 Mock</text>
    <text x="650" y="702" class="warn" font-size="11" font-weight="700" text-anchor="end">后段 / 未完成</text>
    <text x="96" y="733" class="good" font-size="10" font-weight="700">已形成</text>
    <text x="96" y="756" class="label">● 单一 / 工作区与旧路由重定向</text>
    <text x="96" y="778" class="label">● chat / image 独立草稿与统一时间线</text>
    <text x="96" y="800" class="label">● 3 个技能、浮层配置、参考图本地预览</text>
    <text x="96" y="822" class="label">● pending / processing / partial / failed / expired mock</text>
    <text x="390" y="733" class="warn" font-size="10" font-weight="700">关闭前缺口</text>
    <text x="390" y="756" class="label">● 缺结构化 i18n key</text>
    <text x="390" y="778" class="label">● 图片工具未区分普通讨论与明确出图意图</text>
    <text x="390" y="800" class="label">● 当前浏览器矩阵没有 Safari / WebKit</text>
    <text x="390" y="822" class="label">● 当前 HEAD 门禁无新鲜验证证据</text>
    <text x="96" y="858" class="small">其他漂移：quota mock 100 ≠ 需求 30；卡片缺 provider / 尺寸；UI 无 single recreate。</text>
    <text x="96" y="883" class="tiny">判断：direct_syntax + declared docs；运行时状态 unknown。</text>
  </g>

  <g>
    <rect x="710" y="670" width="340" height="250" rx="12" fill="#0f172a"/>
    <rect x="710" y="670" width="340" height="250" rx="12" fill="rgba(136,19,55,.28)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="736" y="702" class="name">Phase 1B · 服务接入</text>
    <text x="1020" y="702" class="bad" font-size="11" font-weight="700" text-anchor="end">未开始</text>
    <text x="736" y="739" class="label">× 无 apps/web/app/api</text>
    <text x="736" y="766" class="label">× 无 Supabase migrations / RLS / pgTAP</text>
    <text x="736" y="793" class="label">× 无真实 SSE / HTTP gateway</text>
    <text x="736" y="820" class="label">× 无 Doubao / MiniMax / Image providers</text>
    <text x="736" y="847" class="label">× 无 Queues / Storage / Workers</text>
    <text x="736" y="883" class="tiny">缺失目录与明确 Phase 1B guard 为直接证据。</text>
  </g>

  <g>
    <rect x="1080" y="670" width="340" height="250" rx="12" fill="#0f172a"/>
    <rect x="1080" y="670" width="340" height="250" rx="12" fill="rgba(76,29,149,.3)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1106" y="702" class="name">Phase 1C · 生产门禁</text>
    <text x="1390" y="702" class="bad" font-size="11" font-weight="700" text-anchor="end">未开始</text>
    <text x="1106" y="739" class="label">× 无 provider 性能与成功率证据</text>
    <text x="1106" y="766" class="label">× 无内容安全固定集证据</text>
    <text x="1106" y="793" class="label">× 无共享健康窗口 / Sentry 门禁</text>
    <text x="1106" y="820" class="label">× 无备份与恢复演练证据</text>
    <text x="1106" y="847" class="label">× 无 production preview / promote 证据</text>
    <text x="1106" y="883" class="tiny">文档已定义门禁，但代码与验证产物尚未落地。</text>
