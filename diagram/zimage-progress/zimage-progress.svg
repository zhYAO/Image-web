<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">ZImage 当前架构与开发进度图</title>
  <desc id="desc">基于仓库文档、目录、导入关系、Git 历史与历史验证产物形成的静态证据图。项目处于 Phase 1A 后段但尚未完成，Phase 1B 和 Phase 1C 尚未开始。Code Ontology Companion 不支持当前 TypeScript Next.js 源码，因此没有生成 RDF 本体快照。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif; }
      .title { fill:#f8fafc; font-size:22px; font-weight:700; }
      .subtitle { fill:#94a3b8; font-size:10px; }
      .section { fill:#cbd5e1; font-size:10px; font-weight:700; letter-spacing:.08em; }
      .name { fill:#f8fafc; font-size:12px; font-weight:700; }
      .label { fill:#cbd5e1; font-size:10px; }
      .small { fill:#94a3b8; font-size:9px; }
      .tiny { fill:#94a3b8; font-size:8px; }
      .good { fill:#6ee7b7; }
      .warn { fill:#fcd34d; }
      .bad { fill:#fda4af; }
    </style>
  </defs>

  <rect width="1500" height="1040" fill="#0f172a"/>
  <rect width="1500" height="1040" fill="url(#grid)"/>

  <!-- Group boundaries -->
  <rect x="40" y="150" width="1420" height="430" rx="14" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="58" y="172" class="section">CURRENT STATIC ARCHITECTURE</text>
  <rect x="40" y="615" width="1420" height="350" rx="14" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="58" y="638" class="section" fill="#fbbf24">DELIVERY PROGRESS</text>

  <!-- Connections: drawn before boxes -->
  <path d="M230 250 L300 250" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <path d="M520 250 L590 250" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <path d="M810 250 L880 250" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
  <path d="M1110 250 L1180 250" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrow-violet)"/>
  <path d="M410 315 L410 370" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M700 315 L700 370" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M990 315 L990 370" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M700 435 L700 505" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M990 435 L990 505" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

