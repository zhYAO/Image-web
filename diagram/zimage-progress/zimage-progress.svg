    <rect x="70" y="200" width="160" height="100" rx="8" fill="#0f172a"/>
    <rect x="70" y="200" width="160" height="100" rx="8" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="150" y="228" class="name" text-anchor="middle">文档基线</text>
    <text x="150" y="250" class="small" text-anchor="middle">requirements v1.3</text>
    <text x="150" y="267" class="small" text-anchor="middle">tech-selection v1.3</text>
    <text x="150" y="284" class="small" text-anchor="middle">architecture v1.3</text>
  </g>

  <g>
