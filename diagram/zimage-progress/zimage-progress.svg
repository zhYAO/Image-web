    <text x="1300" y="240" class="label" text-anchor="middle">AsyncIterable chat delta</text>
    <text x="1300" y="258" class="label" text-anchor="middle">batch 状态模拟 · CRUD</text>
    <text x="1300" y="280" class="small" text-anchor="middle">版本化 localStorage</text>
    <text x="1300" y="300" class="tiny" text-anchor="middle">zimage:mock:v1</text>
  </g>

  <g>
    <rect x="300" y="370" width="220" height="65" rx="8" fill="#0f172a"/>
    <rect x="300" y="370" width="220" height="65" rx="8" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="410" y="397" class="name" text-anchor="middle">路由与生产保护</text>
    <text x="410" y="417" class="small" text-anchor="middle">production 禁止 mock data mode</text>
  </g>

  <g>
    <rect x="590" y="370" width="220" height="65" rx="8" fill="#0f172a"/>
    <rect x="590" y="370" width="220" height="65" rx="8" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="700" y="397" class="name" text-anchor="middle">Zustand UI Store</text>
    <text x="700" y="417" class="small" text-anchor="middle">草稿 · 模式 · 浮层 · 场景</text>
  </g>

  <g>
    <rect x="880" y="370" width="220" height="65" rx="8" fill="#0f172a"/>
    <rect x="880" y="370" width="220" height="65" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.3"/>
    <text x="990" y="397" class="name" text-anchor="middle">Domain Package</text>
    <text x="990" y="417" class="small" text-anchor="middle">types · validation · status aggregation</text>
  </g>

  <g>
    <rect x="560" y="505" width="280" height="50" rx="8" fill="#0f172a"/>
    <rect x="560" y="505" width="280" height="50" rx="8" fill="rgba(251,146,60,.2)" stroke="#fb923c" stroke-width="1.3"/>
    <text x="700" y="527" class="name" text-anchor="middle">组件 / Gateway / E2E 测试源码</text>
