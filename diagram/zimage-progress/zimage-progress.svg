    <rect x="300" y="190" width="220" height="125" rx="8" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="410" y="218" class="name" text-anchor="middle">Next.js 16 Web Shell</text>
    <text x="410" y="240" class="label" text-anchor="middle">/ → ClientWorkspace</text>
    <text x="410" y="258" class="small" text-anchor="middle">/chat, /image → redirect /</text>
