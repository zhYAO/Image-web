# EXAMPLE ONLY. No server changes or production readiness are implied.
# Mount the CLI output as a separate, read-only /srv/zimage-static-assets directory.
# It contains <manifest-sha256>/asset-manifest.json, commerce/, licenses/ and fonts/.
# This serves public resources only. Never map private Storage or upload directories here.
# Install the map in http {}, then the locations inside the existing HTTPS server {}.
# Place these locations before broader regex locations in that server. Validate the
# integrated configuration and permissions separately before any deployment.

# http {} context; production origins are exact. Development permits only loopback
# hostnames (optional port), with neither wildcard subdomains nor credential support.
map $http_origin $zimage_asset_cors_origin {
    default "";
    "https://www.zimage.store" $http_origin;
    "https://zimage.store" $http_origin;
    "~^https?://(localhost|127[.]0[.]0[.]1)(:[0-9]{1,5})?$" $http_origin;
}

# Existing HTTPS server {} context. A regex alias uses its captured relative path;
# Nginx's static file handler supplies 404 when that exact file is missing.
# The complete package is published before this directory becomes visible; never
# edit or replace a resource under an existing content hash.
location ~ "^/static-assets/(?<asset_path>[0-9a-f]{64}/(?:[A-Za-z0-9][A-Za-z0-9._-]*/)*[A-Za-z0-9][A-Za-z0-9._-]*)$" {
    alias /srv/zimage-static-assets/$asset_path;
    autoindex off;
    disable_symlinks on;
    etag on;
    default_type application/octet-stream;
    types {
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        font/otf otf;
        application/json json;
        text/plain txt;
        text/markdown md;
    }

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    if ($request_method = OPTIONS) { return 204; }

    # Empty origin values omit this header, so unlisted origins get no CORS grant.
    add_header Access-Control-Allow-Origin $zimage_asset_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Range" always;
    add_header Access-Control-Max-Age "600" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Without 'always': missing resources and rejected methods must not cache for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# No ^~ here: the validated hash-path regex above must be evaluated.
location /static-assets/ { return 404; }
location = /static-assets { return 404; }
