[Service]
Environment=ZIMAGE_LIFECYCLE_ENABLED=1
RuntimeDirectory=zimage-lifecycle
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=/opt/zimage/trusted-toolchain/node-v24.19.0-linux-x64/bin/node --require /usr/local/libexec/zimage-backend/http-admission.cjs server.js
# The API owns a private Unix status socket, with no socket activation unit.
# The same trusted Node, font EnvironmentFile, UID, memory NODE_OPTIONS and limits
# stay intact; ExecStart adds only the reviewed root-owned admission preload.
# The release wrapper alone stops a drained process. Unsolicited systemctl
# stop/restart cannot be converted into a graceful business drain by a timeout.
