# Candidate server{} include, not installed. The root helper owns both fixed
# flags. Nginx checks them for EVERY request, including keep-alive requests.
# Missing/unstatable flags and every contradictory state are fail-closed.
# Nginx tests existence, not JSON contents or ownership. The root coordinator
# validates regular non-symlink markers, protected ancestors and exact tokens.
open_file_cache off;
set $zimage_ingress_open 0;
set $zimage_ingress_closed 0;
set $zimage_ingress_checking 0;
if (-f /etc/zimage/ingress-open.json) { set $zimage_ingress_open 1; }
if (-f /etc/zimage/ingress-maintenance.json) { set $zimage_ingress_closed 1; }
if (-f /etc/zimage/ingress-checking.json) { set $zimage_ingress_checking 1; }
if ($zimage_ingress_blocked) { return 503; }
error_page 503 = @zimage_ingress_maintenance;
location @zimage_ingress_maintenance {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header Retry-After 30 always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Correlation-Id $zimage_ingress_correlation always;
    return 503 '{"code":"network","correlationId":"$zimage_ingress_correlation","message":"服务正在维护，请保留原请求编号，稍后重试。","retryable":true}';
}
