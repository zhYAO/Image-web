# Candidate replacement for the legacy http{} include. NOT installed.
# It retains the same legacy upstream and adds only the reviewed ingress gate.
# No static frontend/current or B0 /api/meta is required to seal this ingress.
include /etc/nginx/zimage-ingress-maintenance-maps.conf;
map $http_upgrade $zimage_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name www.zimage.store;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimage-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://www.zimage.store$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zimage.store;
    ssl_certificate /etc/letsencrypt/live/www.zimage.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zimage.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    access_log /var/log/nginx/zimage.access.log;
    error_log /var/log/nginx/zimage.error.log;
    include /etc/nginx/zimage-ingress-maintenance-server.conf;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zimage_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
