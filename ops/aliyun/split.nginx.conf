# Reviewed candidate, NOT installed. Include in nginx http{} instead of the
# legacy nginx.conf only after configuration/permissions and B0 compatibility
# acceptance. Keeping an upstream does not prove cross-build RSC compatibility.
include /etc/nginx/zimage-ingress-maintenance-maps.conf;
map $http_upgrade $zimage_split_connection {
    default upgrade;
    '' close;
}
map $request_uri $zimage_split_invalid_path {
    default 0;
    ~*^[^?]*(?:%2f|%5c|%00|//) 1;
    # Do not normalize an apparent /api/../ request into the public homepage.
    ~*^[^?]*/(?:[.]|%2e)(?:[.]|%2e)?(?:/|[?]|$) 1;
}

# Exact Next 16.4.1 protocol names from app-router-headers; preserve their values
# and the entire original query when forwarding. A query-only Flight request
# must never receive the static HTML shell either.
map $args $zimage_split_flight_query {
    default 0;
    ~(^|&)_rsc(?:=|&|$) 1;
}
map "$http_rsc$http_next_router_state_tree$http_next_router_prefetch$http_next_router_segment_prefetch$http_next_url$http_next_action$http_next_hmr_refresh" $zimage_split_flight_header {
    default 1;
    '' 0;
}
map "$zimage_split_flight_header:$zimage_split_flight_query" $zimage_split_legacy {
    default 1;
    '0:0' 0;
}
# Existing Next parsing remains authoritative for URLSearchParams, duplicate or
# encoded scene values, platforms and template escaping on these old URLs.
map $args $zimage_split_scene_query {
    default 0;
    ~(^|&)scene(?:=|&|$) 1;
    # Encoded keys/values need URLSearchParams decoding in the existing proxy.
    "~%[0-9A-Fa-f]{2}" 1;
}

# There is deliberately no index fallback. Unknown paths and missing resources
# cannot become a 200 document. Session syntax matches workspace-route.ts;
# actual existence/ownership is verified by the authenticated API.
map $uri $zimage_split_document {
    default /__zimage_missing_document__;
    / /index.html;
    ~^/home/?$ /home/index.html;
    ~^/terms/?$ /terms/index.html;
    ~^/privacy/?$ /privacy/index.html;
    ~^/create/?$ /create/index.html;
    ~^/(?:workspace|assets|account|login|auth|auth/verify|auth/reset)/?$ /app.html;
    ~^/sessions/[A-Za-z0-9-]+/?$ /app.html;
    ~^/create/(?:product-main|product-set|detail|clone|social|style-reference|model|xhs-poster|apparel-catalog)/?$ /app.html;
}
map $uri $zimage_split_redirect {
    default '';
    ~^/(?:chat|image)/?$ /workspace;
    ~^/skills(?:/[^/]+)?/?$ /create;
}
map $uri $zimage_split_asset_policy {
    default immutable;
    ~(?i)\.html$ no-store;
    ~(?:^|/)version\.json$ no-store;
}
map "$status:$zimage_split_asset_policy" $zimage_split_asset_cache {
    default no-store;
    ~^(?:200|206|304):immutable$ 'public, max-age=31536000, immutable';
}

server {
    listen 80;
    listen [::]:80;
    server_name www.zimage.store;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimage-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://www.zimage.store$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zimage.store;
    ssl_certificate /etc/letsencrypt/live/www.zimage.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zimage.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    access_log /var/log/nginx/zimage.access.log;
    error_log /var/log/nginx/zimage.error.log;
    include /etc/nginx/zimage-ingress-maintenance-server.conf;

    root /opt/zimage/frontend/current;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    autoindex off;
    merge_slashes off;
    # The maintenance-server include above owns open_file_cache off for this
    # server. Repeating it here is an nginx duplicate-directive error.
    # Atomic current and retained namespace symlinks are root-managed and
    # validated by the helper. disable_symlinks on would break both pointers.
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Vary 'RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch, Next-Url, Next-Action' always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded '';
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $zimage_split_connection;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_ignore_client_abort off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Block metadata and dotfiles before alias/prefix selection, including
    # namespaced /.release/manifest.json. Nginx normalizes escaped URI segments.
    if ($uri ~ "(^|/)\.") { return 404; }
    if ($zimage_split_invalid_path) { return 404; }

    location = /api { proxy_pass http://127.0.0.1:3100; }
    location = /api/uploads {
        # 10 MiB file + 256 KiB multipart envelope; application also counts the
        # real stream bytes, applies its ingestion deadline/concurrency budget.
        client_max_body_size 10496k;
        proxy_pass http://127.0.0.1:3100;
    }
    location ^~ /api/ { proxy_pass http://127.0.0.1:3100; }
    location = /_next { return 404; }
    location ^~ /_next/ { proxy_pass http://127.0.0.1:3100; }
    # Preserve the existing backend's old public-resource protocol as well.
    location = /static-assets { return 404; }
    location ^~ /static-assets/ { proxy_pass http://127.0.0.1:3100; }

    # A regex alias maps a validated namespace and relative path without any
    # rewrite or fallback. The static handler returns an actual missing-file 404.
    location ~ "^/frontend-assets/(?<zimage_ns>[A-Za-z0-9][A-Za-z0-9._-]{0,127})/(?<zimage_file>(?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*\.(?:html|js|mjs|css|json|png|jpe?g|webp|gif|svg|ico|woff2?|txt|md))$" {
        alias /opt/zimage/frontend/assets/$zimage_ns/$zimage_file;
        types {
            text/html html;
            application/javascript js mjs;
            text/css css;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
            image/gif gif;
            image/svg+xml svg;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
            text/plain txt;
            text/markdown md;
        }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control $zimage_split_asset_cache always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /frontend-assets/ { return 404; }
    location = /frontend-assets { return 404; }
    location = /version.json {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /version.json =404;
    }
    # Current unversioned catalogue previews are mutable, never immutable.
    location ~ "^/commerce/(?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*\.(?:png|jpe?g|webp|gif|svg|ico)$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
    }
    location ~ ^/create/batch/?$ {
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag noindex always;
        return 404;
    }

    error_page 418 = @zimage_split_legacy;
    location @zimage_split_legacy {
        # No URI part: retain original path/query, method, body and all Next
        # headers. Do not intercept backend 404/410/5xx or retry a paid request.
        proxy_pass http://127.0.0.1:3100;
    }
    location = / {
        if ($zimage_split_legacy) { return 418; }
        if ($zimage_split_scene_query) { return 418; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /index.html =404;
    }
    location ~ ^/workspace/?$ {
        if ($zimage_split_legacy) { return 418; }
        if ($zimage_split_scene_query) { return 418; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /app.html =404;
    }
    location / {
        if ($zimage_split_legacy) { return 418; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($zimage_split_redirect != '') { return 308 $zimage_split_redirect$is_args$args; }
        try_files $zimage_split_document =404;
    }
}
