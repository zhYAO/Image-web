name: ZImage quality
sources:
  zimage:
    type: codeup
    name: ZImage Codeup mirror
    endpoint: https://zimage-cn-shanghai.devops.aliyuncs.com/codeup/zhYAO/Image-web.git
    branch: codex/yunxiao-quality-2098dfb
    certificate:
      type: serviceConnection
      serviceConnection: rpy5jbjw7kknkz88
variables:
  - key: EXPECTED_COMMIT
    value: ''
  - key: ZIMAGE_FLOW_ISOLATED_DOCKER
    value: '0'
stages:
  checks:
    name: Checks
    jobs:
      quality:
        name: quality
        timeoutMinutes: 45
        runsOn:
          group: public/cn-hangzhou
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux4@sha256:77802307369f3797bb079ead332059a1fefc457fd37f2740484850eb79be1a00
          instanceType: LARGE_4C8G
        steps:
          check:
            name: Run quality checks
            step: Command
            with:
              run: |
                set -euo pipefail
                if ! command -v openssl >/dev/null; then
                  timeout 120s dnf -qy install openssl
                fi
                cd "$PROJECT_DIR"
                python3 --version
                if [ "$(id -u)" -ne 0 ]; then
                  exec bash ops/flow/run-checks.sh quality
                fi
                work="$(mktemp -d)"
                trap 'rm -rf -- "$work"' EXIT
                git clone --quiet --no-local --depth=1 --no-tags -- "$PROJECT_DIR" "$work/source"
                mkdir "$work/home"
                chown -R "$(id -u nobody):$(id -g nobody)" "$work"
                runuser -u nobody -- env HOME="$work/home" bash -c \
                  'cd -- "$1" && exec bash ops/flow/run-checks.sh quality' bash "$work/source"
      database:
        name: database
        timeoutMinutes: 30
        enableDockerDaemon: true
        runsOn:
          group: public/cn-hangzhou
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: LARGE_4C8G
        steps:
          check:
            name: Test local database
            step: Command
            with:
              run: |
                set -euo pipefail
                docker_host="$(printenv DOCKER_HOST || true)"
                if [[ -z "$docker_host" ]]; then
                  docker_host="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
                fi
                case "$docker_host" in
                  unix:///*|tcp://127.0.0.1:*|tcp://localhost:*) ;;
                  *) echo 'Database task requires a local Docker endpoint.' >&2; exit 1 ;;
                esac
                unset DOCKER_CONTEXT
                export DOCKER_HOST="$docker_host"
                docker version --format 'Docker server {{.Server.Version}}'
                containers="$(docker ps -aq)"
                volumes="$(docker volume ls -q)"
                if [[ -n "$containers" || -n "$volumes" ]]; then
                  echo 'Docker daemon already contains containers or volumes.' >&2
                  exit 1
                fi
                cd "$PROJECT_DIR"
                bash ops/flow/run-checks.sh database
