packages:
  - apps/*
  - packages/*

confirmModulesPurge: false

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Temporary compatible security pins. Remove when parent resolutions no longer
# select these vulnerable versions; keep older major lines untouched.
overrides:
  'fast-uri@3.1.6': '3.1.8'
  'brace-expansion@5.0.9': '5.0.12'
